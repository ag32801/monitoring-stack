global:
  scrape_interval: 15s

scrape_configs:
  # 1. Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  # 2. Laptop system metrics (CPU, RAM, Disk)
  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # 3. Pinging Laptop
  - job_name: 'ping_devices'
    metrics_path: /probe
    params:
      module: [icmp]
    static_configs:
      - targets:
          - '192.168.0.104'  #Laptop IP
          - '192.168.0.102'  #Phone IP
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
    